[project]
name = "flowerstore-cli"
version = "0.1.0"
description = "Search FlowerStore.ph gifts, delivery slots and order status from the terminal, as JSON."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["curl_cffi>=0.7"]

[project.scripts]
flowerstore = "flowerstore_cli.cli:main"
flowerstore-tui = "flowerstore_cli.tui:main"

[project.optional-dependencies]
tui = [
    "textual>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowerstore_cli"]

[dependency-groups]
dev = ["pytest>=8", "textual>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
