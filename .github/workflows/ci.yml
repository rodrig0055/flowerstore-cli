name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras --group dev
      # Offline: feed parsing, search, cutoffs, and the TUI driven against a fake data layer.
      # flowerstore.ph's Cloudflare challenges cloud IPs, so live checks run locally only.
      - run: uv run pytest -q
      - run: uv run flowerstore --help && uv run python -c "import flowerstore_cli.tui"
